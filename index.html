<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Most Popular Messaging Apps</h1>

  <div class="apps">

    <div class="app">
      <div class="icon">
        <img src="./img_6/image 1 (1).png" alt="Instagram">
        <span class="badge">11</span>
      </div>
      <p class="name">Instagram</p>
    </div>

    <div class="app">
      <div class="icon">
        <img src="./img_6/image 2 (2).png" alt="Telegram">
        <span class="badge">113</span>
      </div>
      <p class="name">Telegram</p>
    </div>

    <div class="app">
      <div class="icon">
        <img src="./img_6/image 3 (1).png" alt="TikTok">
        <span class="badge">6</span>
      </div>
      <p class="name">TikTok</p>
    </div>

  </div>
</body>
</html>
